[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[project]
name = "dpm-synth"
version = "0.1.0"
description = "Generate synthetic EBA xBRL-CSV reports that satisfy a module's DPM-XL validation rules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Luuk Hopman", email = "github@luukhopman.nl" }]
keywords = ["DPM", "DPM-XL", "EBA", "XBRL", "xBRL-CSV", "test data", "synthetic data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["dpm-xl>=1.0,<2", "dpm-xbrl>=1.0,<2"]

[project.urls]
Homepage = "https://github.com/luukhopman/dpm-synth"
Source = "https://github.com/luukhopman/dpm-synth"
Issues = "https://github.com/luukhopman/dpm-synth/issues"
Changelog = "https://github.com/luukhopman/dpm-synth/blob/main/CHANGELOG.md"
Documentation = "https://luukhopman.github.io/dpm-synth/"

[project.scripts]
dpm-synth = "dpmsynth.cli:main"

[dependency-groups]
test = ["pytest", "pytest-cov>=7.1,<8"]
lint = ["ruff", "ty"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
preview = true
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "DOC",  # pydoclint: docstring parameters, returns, and exceptions
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "ERA",  # eradicate: commented-out code
    "F",    # Pyflakes
    "I",    # isort
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit security checks
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "incorrect-blank-line-before-class", # incompatible with D211
    "multi-line-summary-second-line", # incompatible with D212
    "docstring-extraneous-exception", # propagated exceptions are part of the public contract
    "assert", # tests and internal invariants intentionally use assert
]

[tool.ruff.lint.per-file-ignores]
# Tests need no docstrings; fixture JSON stays readable unwrapped.
"tests/*" = ["D", "DOC", "S", "line-too-long"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["src", "tests"]

[tool.uv.build-backend]
module-name = "dpmsynth"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
source = ["dpmsynth"]
branch = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

# dpm-xl and dpm-xbrl 1.0 are not on PyPI yet; until they are, both come from
# their GitHub main branches. See AGENTS.md.
[tool.uv.sources]
dpm-xl = { git = "https://github.com/luukhopman/dpm-xl", branch = "main" }
dpm-xbrl = { git = "https://github.com/luukhopman/dpm-xbrl", branch = "main" }
