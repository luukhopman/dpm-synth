[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[project]
name = "dpm-synth"
version = "1.1.0"
description = "Generate synthetic EBA xBRL-CSV test reports that pass Data Point Model (DPM 2.0) rules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Luuk Hopman", email = "github@luukhopman.nl" }]
keywords = [
    "Data Point Model",
    "DPM",
    "DPM 2.0",
    "DPM-XL",
    "EBA",
    "XBRL",
    "xBRL-CSV",
    "XBRL-XML",
    "COREP",
    "FINREP",
    "regulatory reporting",
    "supervisory reporting",
    "EBA taxonomy",
    "filing rules",
    "validation rules",
    "report package",
    "dpm-toolkit",
    "test data",
    "synthetic data",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["dpm-xl>=1.3,<2", "dpm-xbrl>=1.1,<2"]

[project.urls]
Homepage = "https://luukhopman.github.io/dpm-synth/"
Documentation = "https://luukhopman.github.io/dpm-synth/"
Source = "https://github.com/luukhopman/dpm-synth"
Issues = "https://github.com/luukhopman/dpm-synth/issues"
Changelog = "https://luukhopman.github.io/dpm-synth/project/changelog/"

[project.scripts]
dpm-synth = "dpmsynth.cli:main"

[dependency-groups]
test = ["pytest", "pytest-cov>=7.1,<8"]
lint = ["ruff", "ty"]
docs = [
    "zensical>=0.0.72,<0.1",
    "mkdocstrings-python>=2.0.10,<3",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
preview = true
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "DOC",  # pydoclint: docstring parameters, returns, and exceptions
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "ERA",  # eradicate: commented-out code
    "F",    # Pyflakes
    "I",    # isort
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit security checks
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "incorrect-blank-line-before-class", # incompatible with D211
    "multi-line-summary-second-line", # incompatible with D212
    "docstring-extraneous-exception", # propagated exceptions are part of the public contract
    "assert", # tests and internal invariants intentionally use assert
]

[tool.ruff.lint.per-file-ignores]
# Tests need no docstrings; fixture JSON stays readable unwrapped.
"tests/*" = ["D", "DOC", "S", "line-too-long"]
# The docs build runs the zensical command it is given, never user input.
"scripts/*" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["src", "tests"]

[tool.uv.build-backend]
module-name = "dpmsynth"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
source = ["dpmsynth"]
branch = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

